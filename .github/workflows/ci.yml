name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = Jetson (JetPack 6, Ubuntu 22.04), 3.12 = mini PC (Ubuntu 24.04)
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: pytest
        run: |
          set +e
          pytest -q -rf --tb=line > pytest.txt 2>&1
          status=$?
          if [ $status -ne 0 ]; then grep -E "FAILED|Error|error|assert" pytest.txt | head -n 45 | while IFS= read -r line; do echo "::error title=pytest::$line"; done; fi
          exit $status
      - run: pytest -q ../tools/test_bench.py

  security-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e . pip-audit bandit
      # Znane podatności w zależnościach (baza PyPA / OSV).
      - name: pip-audit
        run: |
          set +e
          pip-audit --skip-editable --desc > audit.txt 2>&1
          status=$?
          if [ $status -ne 0 ]; then head -n 40 audit.txt | while IFS= read -r line; do echo "::error title=pip-audit::$line"; done; fi
          exit $status
      # Statyczna analiza bezpieczeństwa kodu Pythona.
      - run: bandit -r app -ll

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: flutter analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.txt 2>&1
          status=$?
          if [ $status -ne 0 ]; then grep -E "error|warning" analyze.txt | head -n 40 | while IFS= read -r line; do echo "::error title=analyze::$line"; done; fi
          exit $status
      - name: flutter test
        run: |
          set +e
          flutter test > test.txt 2>&1
          status=$?
          if [ $status -ne 0 ]; then tail -n 40 test.txt | while IFS= read -r line; do echo "::error title=flutter test::$line"; done; fi
          exit $status

  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: shellcheck device/install.sh

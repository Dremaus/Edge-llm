name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # co tydzień, poniedziałek 03:17 UTC

permissions:
  contents: read

jobs:
  secrets:
    name: Wykrywanie sekretów (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (cała historia)
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --report-format json --report-path /repo/gitleaks.json --exit-code 1
          status=$?
          if [ $status -ne 0 ] && [ -f gitleaks.json ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=gitleaks::reguła \(.RuleID) w commicie \(.Commit[0:8])"' gitleaks.json | head -n 40
          fi
          exit $status

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

name: Lock dependencies

# Generuje server/requirements.lock z sumami kontrolnymi (pip-compile --generate-hashes)
# i wypycha go na gałąź deps/requirements-lock do przejrzenia i scalenia.
# Instalator urządzenia używa pliku z `pip install --require-hashes`, więc podmieniona
# paczka na PyPI nie zostanie zainstalowana.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [server/pyproject.toml]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"  # najstarszy obsługiwany (Jetson); paczki działają też na 3.12
      - run: pip install pip-tools
      - name: pip-compile
        working-directory: server
        run: pip-compile --generate-hashes --strip-extras --allow-unsafe --output-file requirements.lock pyproject.toml
      - name: Wypchnij na gałąź do przeglądu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B deps/requirements-lock
          git add server/requirements.lock
          git commit -m "Zależności serwera przypięte z sumami kontrolnymi" || exit 0
          git push -f origin deps/requirements-lock

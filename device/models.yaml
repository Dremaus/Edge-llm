    notes: Główny przy 24+ GB; MoE (4 mld aktywnych), Q4_K_M 16,8 GB. Karta modelu oznacza go jako angielski — polski do sprawdzenia w eval/ (do tego czasu Bielik dla polskiego). Obrazy wymagają mmproj (1,2 GB), którego Ollama z repozytorium HF może nie wczytać — do sprawdzenia na sprzęcie. Model "uncensored": ochrona wyłącznie po stronie serwera.


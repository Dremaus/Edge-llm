# Katalog zatwierdzonych modeli. Źródło: Hugging Face / biblioteka Ollamy.
# role: router | main | code | alt
# status: approved  — instalator pobiera model
#         candidate — czeka na tydzień testów (eval/, tools/bench.py); instalator pomija
# min_ram_gb / max_ram_gb (opcjonalne) — zakres pamięci RAM (wartość z `free -g`, 32 GB pokazuje 30),
#   w którym model jest pobierany; bez nich model jest pobierany zawsze.
# Przed wydaniem: przypiąć wersję (hash commita) i sumę kontrolną każdego pliku.

models:
  - id: qwen3.5:0.8b
    role: router
    status: approved
    source: ollama-library
    license: Apache-2.0
    notes: Router i proste czynności; poniżej 2 GB przy 4 bitach.

  - id: qwen3.5:4b
    role: main
    status: approved
    max_ram_gb: 23
    source: ollama-library
    license: Apache-2.0
    notes: Model główny (do czasu zatwierdzenia kandydatów poniżej); polski i angielski, rozumie obrazy; ok. 3 GB przy 4 bitach.

  - id: hf.co/speakleash/Bielik-4.5B-v3.0-Instruct-GGUF:Q8_0
    role: alt
    status: approved
    source: huggingface
    license: Apache-2.0
    notes: Specjalizowany w polskim; preinstalowany, włączany w ustawieniach.

# --- Kandydaci (decyzja 5.11.2026, do sprawdzenia w tygodniu testów) ---
# Dla każdego: licencja według karty modelu (nie zweryfikowana), jakość po polsku (eval/),
# wywoływanie narzędzi, odporność na złośliwy dokument. Nazwy repozytoriów HF do potwierdzenia
# przed zmianą statusu na approved. Modele "uncensored" nie odmawiają, więc całą ochronę
# zapewnia serwer (polityka ALLOW/CONFIRM/DENY, potwierdzenia, piaskownica).


# /etc/systemd/system/ollama.service.d/hardening.conf
# Ollama nasłuchuje tylko na localhost i nie przyjmuje zapytań z przeglądarek.
[Service]
Environment=OLLAMA_HOST=127.0.0.1:11434
Environment=OLLAMA_ORIGINS=
# Jeden duży model naraz (model główny 17 GB + kod 22 GB nie mieszczą się w 32 GB); router/Bielik mniejsze.
Environment=OLLAMA_MAX_LOADED_MODELS=2
Environment=OLLAMA_KEEP_ALIVE=10m
NoNewPrivileges=true
ProtectHome=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
LockPersonality=true

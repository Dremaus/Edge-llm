# /etc/systemd/system/ollama.service.d/egress.conf
# Po pobraniu modeli Ollama nie ma po co łączyć się z internetem. Blokada ogranicza skutki błędu
# lub złośliwego modelu (por. badanie Cohere: model próbował wysłać plik do chmury).
# Czasowe zdjęcie blokady na czas aktualizacji modeli: sudo device/pull-models.sh
[Service]
IPAddressDeny=any
IPAddressAllow=localhost
